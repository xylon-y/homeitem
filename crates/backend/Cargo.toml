[package]
name = "backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
common.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
async-trait = "0.1"

salvo = { version = "1.2", features = ["serve-static", "cors"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.42", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.37"
argon2 = "0.6"
rand = "0.9"
jsonwebtoken = { version = "12", features = ["rust_crypto"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "tokio1", "tokio1-native-tls", "smtp-transport", "native-tls"] }
rust-embed = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mime_guess = "2"
csv = "1.3"

[dev-dependencies]
tempfile = "3"